<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C6E63">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Directorio de Clientes — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="auth-card">
  <h1 id="auth-title">Iniciar sesión</h1>
  <p class="sub">Directorio de clientes — acceso privado</p>
  <div id="auth-error" class="auth-error hidden"></div>

  <div id="auth-login">
    <div class="field">
      <label for="login-user">Usuario</label>
      <input list="user-list" id="login-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="tu usuario">
      <datalist id="user-list"></datalist>
    </div>
    <div class="field">
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button id="btn-login" style="width:100%">Entrar</button>
    <div class="auth-toggle">¿No tienes cuenta? <button class="link" id="show-signup">Crear una</button></div>
  </div>

  <div id="auth-signup" class="hidden">
    <div class="field">
      <label for="signup-user">Elige un usuario</label>
      <input id="signup-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="signup-pass">Elige una contraseña</label>
      <input type="password" id="signup-pass" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="signup-pass2">Confirma la contraseña</label>
      <input type="password" id="signup-pass2" autocomplete="new-password">
    </div>
    <button id="btn-signup" style="width:100%">Crear cuenta</button>
    <div class="auth-toggle">¿Ya tienes cuenta? <button class="link" id="show-login">Iniciar sesión</button></div>
  </div>
</div>

<script src="js/comun.js"></script>
<script src="js/login.js"></script>
</body>
</html>
